<!-- @dsCard group="Keypad" height=180 subtitle="Letter key, lit key, function key" -->
<div class="nl-root" style="display:flex;gap:24px;align-items:center;padding:32px;">
  <button class="nl-key" type="button" aria-label="4, G H I"><span class="nl-key__digit">4</span><span class="nl-key__letters">GHI</span></button>
  <button class="nl-key is-lit" type="button" aria-label="9, W X Y Z"><span class="nl-key__digit">9</span><span class="nl-key__letters">WXYZ</span></button>
  <button class="nl-key" type="button" aria-label="0, space"><span class="nl-key__digit">0</span><span class="nl-key__word">Space</span></button>
</div>
