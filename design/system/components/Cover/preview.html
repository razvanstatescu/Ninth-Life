<!-- @dsCard height=320 -->
<div style="position:relative;width:960px;height:320px;overflow:hidden;background:var(--ground);font-family:var(--font-sans);">
  <svg width="960" height="320" viewBox="0 0 960 320" aria-hidden="true" style="position:absolute;left:0;top:0;">
    <!--
      blocks: night slab 460 x 360 (radius-panel), moon bubble 300 x 330 (radius-panel), 11 plum keys and 1 ember key at 76 (radius-key)
      arrangement: one tall slab bleeding off the top, right and bottom, the moon bubble inside it, the keypad grid inside the bubble bleeding off the bottom
      pattern: tiles cut by the radius tokens, because the keypad's 12 keys are the system's most specific shape (README: "the ninth key")
      steps and radii: space-3 (12) gaps, space-6 (24) padding, radius-panel 44, radius-key 24
    -->
    <style>
      .night{fill:var(--night)} .moon{fill:var(--moon)} .key{fill:var(--plum)} .ember{fill:var(--ember)}
      .r-panel{rx:var(--radius-panel)} .r-key{rx:var(--radius-key)}
    </style>
    <rect class="night r-panel" x="540" y="-20" width="460" height="360"/>
    <rect class="moon r-panel" x="600" y="24" width="300" height="330"/>
    <rect class="key r-key" x="624" y="48" width="76" height="76"/>
    <rect class="key r-key" x="712" y="48" width="76" height="76"/>
    <rect class="key r-key" x="800" y="48" width="76" height="76"/>
    <rect class="key r-key" x="624" y="136" width="76" height="76"/>
    <rect class="key r-key" x="712" y="136" width="76" height="76"/>
    <rect class="key r-key" x="800" y="136" width="76" height="76"/>
    <rect class="key r-key" x="624" y="224" width="76" height="76"/>
    <rect class="key r-key" x="712" y="224" width="76" height="76"/>
    <rect class="ember r-key" x="800" y="224" width="76" height="76"/>
    <rect class="key r-key" x="624" y="312" width="76" height="76"/>
    <rect class="key r-key" x="712" y="312" width="76" height="76"/>
    <rect class="key r-key" x="800" y="312" width="76" height="76"/>
  </svg>
  <div style="position:absolute;left:40px;bottom:36px;width:440px;">
    <h1 style="margin:0;font-size:112px;line-height:0.95;font-weight:800;letter-spacing:-0.02em;color:var(--ink);">Ninth<br>Life</h1>
    <p style="margin:16px 0 0;font-size:14px;line-height:20px;color:var(--ink-muted);">The old keypad, back as your voice.</p>
  </div>
</div>
