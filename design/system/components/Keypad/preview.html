<!-- @dsCard group="Keypad" height=560 subtitle="12 keys on the bubble panel, second row scanning" -->
<div class="nl-root" style="display:flex;justify-content:center;padding:40px 24px;">
  <div class="nl-keypad" role="group" aria-label="Keypad">
    <div class="nl-keypad__row">
      <button class="nl-key" type="button" aria-label="1, punctuation"><span class="nl-key__digit">1</span><span class="nl-key__word">.,?!</span></button>
      <button class="nl-key" type="button" aria-label="2, A B C"><span class="nl-key__digit">2</span><span class="nl-key__letters">ABC</span></button>
      <button class="nl-key" type="button" aria-label="3, D E F"><span class="nl-key__digit">3</span><span class="nl-key__letters">DEF</span></button>
    </div>
    <div class="nl-keypad__row is-scanning">
      <button class="nl-key" type="button" aria-label="4, G H I"><span class="nl-key__digit">4</span><span class="nl-key__letters">GHI</span></button>
      <button class="nl-key" type="button" aria-label="5, J K L"><span class="nl-key__digit">5</span><span class="nl-key__letters">JKL</span></button>
      <button class="nl-key" type="button" aria-label="6, M N O"><span class="nl-key__digit">6</span><span class="nl-key__letters">MNO</span></button>
    </div>
    <div class="nl-keypad__row">
      <button class="nl-key" type="button" aria-label="7, P Q R S"><span class="nl-key__digit">7</span><span class="nl-key__letters">PQRS</span></button>
      <button class="nl-key" type="button" aria-label="8, T U V"><span class="nl-key__digit">8</span><span class="nl-key__letters">TUV</span></button>
      <button class="nl-key is-lit" type="button" aria-label="9, W X Y Z"><span class="nl-key__digit">9</span><span class="nl-key__letters">WXYZ</span></button>
    </div>
    <div class="nl-keypad__row">
      <button class="nl-key" type="button" aria-label="Back"><span class="nl-key__digit">*</span><span class="nl-key__word">Back</span></button>
      <button class="nl-key" type="button" aria-label="0, space"><span class="nl-key__digit">0</span><span class="nl-key__word">Space</span></button>
      <button class="nl-key" type="button" aria-label="Next word"><span class="nl-key__digit">#</span><span class="nl-key__word">Next</span></button>
    </div>
  </div>
</div>
