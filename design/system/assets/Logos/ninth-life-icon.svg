<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">Ninth Life</title>
  <desc id="desc">A speech bubble with cat ears holding a 3 by 3 keypad. The ninth key glows amber.</desc>
  <defs>
    <radialGradient id="night" cx="34%" cy="26%" r="90%">
      <stop offset="0%" stop-color="#3D2478"></stop>
      <stop offset="55%" stop-color="#25154F"></stop>
      <stop offset="100%" stop-color="#140A2E"></stop>
    </radialGradient>
    <linearGradient id="moon" gradientUnits="userSpaceOnUse" x1="0" y1="186" x2="0" y2="846">
      <stop offset="0%" stop-color="#F3EEFF"></stop>
      <stop offset="100%" stop-color="#DCD2F7"></stop>
    </linearGradient>
    <linearGradient id="ember" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFD27A"></stop>
      <stop offset="100%" stop-color="#FF9F2E"></stop>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="22"></feGaussianBlur>
    </filter>
  </defs>

  
  <rect width="1024" height="1024" fill="url(#night)"></rect>

  
  <g fill="none" stroke="url(#moon)" stroke-width="28" stroke-linejoin="round">
    <polygon points="290,336 310,186 430,306"></polygon>
    <polygon points="734,336 714,186 594,306"></polygon>
    <polygon points="340,730 318,846 450,752"></polygon>
    <rect x="252" y="300" width="520" height="460" rx="110"></rect>
  </g>
  <g fill="url(#moon)">
    <polygon points="290,336 310,186 430,306"></polygon>
    <polygon points="734,336 714,186 594,306"></polygon>
    <polygon points="340,730 318,846 450,752"></polygon>
    <rect x="252" y="300" width="520" height="460" rx="110"></rect>
  </g>

  
  <g fill="#2A1856">
    <rect x="332" y="350" width="104" height="104" rx="26"></rect>
    <rect x="460" y="350" width="104" height="104" rx="26"></rect>
    <rect x="588" y="350" width="104" height="104" rx="26"></rect>
    <rect x="332" y="478" width="104" height="104" rx="26"></rect>
    <rect x="460" y="478" width="104" height="104" rx="26"></rect>
    <rect x="588" y="478" width="104" height="104" rx="26"></rect>
    <rect x="332" y="606" width="104" height="104" rx="26"></rect>
    <rect x="460" y="606" width="104" height="104" rx="26"></rect>
  </g>

  
